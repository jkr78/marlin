name: Python bindings

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: universal2-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
          manylinux: auto
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  test:
    name: Tests + lint + mypy + pyright (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the latest release.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create venv at repo root
        run: |
          # Repo root, not bindings/python — avoids mypy walking into
          # .venv/ when running `mypy --strict .` from bindings/python.
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      # The `dev` extra in bindings/python/pyproject.toml is the one list of
      # tools, shared with `just py-setup`. Read it here; installing the
      # extra itself (`pip install -e '.[dev]'`) would also compile the
      # extension, which a later step does in release mode.
      - name: Install test deps
        run: |
          python - > "$RUNNER_TEMP/dev-requirements.txt" <<'EOF'
          import tomllib

          with open("bindings/python/pyproject.toml", "rb") as f:
              extras = tomllib.load(f)["project"]["optional-dependencies"]
          print("\n".join(extras["dev"]))
          EOF
          pip install -r "$RUNNER_TEMP/dev-requirements.txt"
      # The bindings crate is excluded from the Cargo workspace, so the main
      # CI's `just fmt-check` / `just lint` never see its Rust. Gate it here.
      - name: cargo fmt --check (bindings Rust)
        working-directory: bindings/python
        run: cargo fmt --check
      - name: clippy (bindings Rust)
        working-directory: bindings/python
        run: cargo clippy --all-targets -- -D warnings
      - name: Install into venv
        working-directory: bindings/python
        run: maturin develop --release
      - name: Run pytest
        working-directory: bindings/python
        run: python -m pytest tests/ -v
      - name: Run mypy --strict
        working-directory: bindings/python
        run: python -m mypy --strict .
      # Runs pyright (its own pyrightconfig.json, `standard` mode). Catches
      # union/optional-narrowing issues mypy --strict does not; needs the
      # extension installed (maturin develop above) to resolve `marlin.*`.
      - name: Run pyright
        working-directory: bindings/python
        run: pyright
      # Compares the public stubs with the built extension: signatures,
      # @final, positional-only. Same command as `just py-type-check`.
      - name: Run stubtest
        working-directory: bindings/python
        run: python -m mypy.stubtest marlin --ignore-missing-stub --allowlist stubtest-allowlist.txt

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: pip install 'maturin>=1.7,<2.0'
      - name: Build sdist
        working-directory: bindings/python
        run: maturin sdist --out dist/
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  # Publishes wheels + sdist to PyPI on tag push (refs/tags/v*) or
  # manual workflow_dispatch. Skipped on regular branch pushes / PRs.
  #
  # Auth: PyPI Trusted Publishing via OIDC. Requires a "pending publisher"
  # configured at https://pypi.org/manage/account/publishing/ before the
  # first publish (project name: marlin-py, owner: jkr78, repo: marlin,
  # workflow: python-bindings.yml). After the first publish, the entry
  # graduates from "pending" to a regular trusted publisher.
  #
  # Path B fallback (if you prefer a long-lived API token over OIDC):
  #   1. Drop `permissions: id-token: write`
  #   2. Add to the publish step:
  #        with:
  #          password: ${{ secrets.PYPI_API_TOKEN }}
  #   3. Store the token at https://github.com/jkr78/marlin/settings/secrets/actions
  publish:
    name: Publish to PyPI
    needs: [build, test, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
