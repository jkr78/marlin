name: Python bindings

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: universal2-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          working-directory: bindings/python
          manylinux: auto
          sccache: true
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  test:
    name: Tests + lint + mypy + pyright (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the latest release.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      # The same recipes as a local run, so the two cannot diverge: `py-setup`
      # creates the venv at the repo root (not bindings/python, which would
      # put .venv/ under `mypy --strict .`) and installs the `dev` extra;
      # `py-ci` is fmt + clippy for the bindings Rust (workspace-excluded, so
      # the main CI never sees it), the release build, pytest, mypy, pyright
      # and stubtest.
      - name: just py-setup
        run: just py-setup
      - name: just py-ci
        run: just py-ci

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install maturin
        run: pip install 'maturin>=1.7,<2.0'
      - name: Build sdist
        working-directory: bindings/python
        run: maturin sdist --out dist/
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  # Publishes wheels + sdist to PyPI on tag push (refs/tags/v*) or
  # manual workflow_dispatch. Skipped on regular branch pushes / PRs.
  #
  # Auth: PyPI Trusted Publishing via OIDC. Requires a "pending publisher"
  # configured at https://pypi.org/manage/account/publishing/ before the
  # first publish (project name: marlin-py, owner: jkr78, repo: marlin,
  # workflow: python-bindings.yml). After the first publish, the entry
  # graduates from "pending" to a regular trusted publisher.
  #
  # Path B fallback (if you prefer a long-lived API token over OIDC):
  #   1. Drop `permissions: id-token: write`
  #   2. Add to the publish step:
  #        with:
  #          password: ${{ secrets.PYPI_API_TOKEN }}
  #   3. Store the token at https://github.com/jkr78/marlin/settings/secrets/actions
  publish:
    name: Publish to PyPI
    needs: [build, test, sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
